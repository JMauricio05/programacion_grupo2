<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos</title>
</head>
<body>
    <form name="contactoForm">
        <div>
            <input name="nombre" type="text" placeholder="Nombre del Contacto">
        </div>
        <div>
            <input name="email" type="email" placeholder="Email del Contacto">
        </div>
        <div>
            <input name="telefono" type="text" placeholder="Teléfono del Contacto">
        </div>
        <button type="submit">Guardar</button>
    </form>

    <table id="contactos">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Teléfono</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="js/contactos.js"></script>
</body>
</html>
